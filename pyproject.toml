[project]
name = "crewai-happyhorse"
version = "0.1.0"
description = "HappyHorse by Ace Data Cloud: native CrewAI video generation and same-task retrieval tools"
readme = "README.pypi.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{name = "Ace Data Cloud Dev", email = "dev@acedata.cloud"}]
keywords = ["crewai", "happyhorse", "video", "agents", "acedatacloud"]
dependencies = ["crewai>=1.15.28,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3"]
[project.urls]
Homepage = "https://github.com/AceDataCloud/HappyHorseCrewAI"
Repository = "https://github.com/AceDataCloud/HappyHorseCrewAI"
Issues = "https://github.com/AceDataCloud/HappyHorseCrewAI/issues"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.15.1", "build>=1,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/happyhorse_crewai"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
